name: admin_web
description: "ServeNow Admin Panel — Complete management dashboard for home services"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  get: ^4.6.6
  provider: ^6.1.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  syncfusion_flutter_charts: ^27.1.48
  flutter_easyloading: ^3.0.5
  nb_utils: ^7.0.1
  image_picker_web: ^4.0.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  data_table_2: ^2.5.14
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  dropdown_search: ^5.0.6
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
