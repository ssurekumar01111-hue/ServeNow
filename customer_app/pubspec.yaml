name: customer
description: "ServeNow Customer App — Book home services instantly"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^17.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  cloud_functions: any
  flutter_local_notifications: ^21.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  google_maps_flutter: ^2.15.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  shimmer: ^3.0.0
  # razorpay_flutter: ^1.4.1  # Uncomment after adding your Razorpay keys
  very_good_analysis: ^10.2.0
  google_sign_in: ^6.2.1
  pinput: ^6.0.2
  geoflutterfire_plus: ^0.0.34
  share_plus: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
